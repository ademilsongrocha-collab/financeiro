<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Planejamento Financeiro Fácil & Família</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }
    button, input, select {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Servidor de sincronização em nuvem gratuito e público (KV Store)
    const SYNC_SERVER = "https://api.counterapi.dev/v1"; 

    const Icons = {
      Wallet: () => <svg className="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>,
      TrendingUp: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      TrendingDown: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" /></svg>,
      Users: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
      Volume2: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,
      VolumeX: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>,
      PlusCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Trash2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Key: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>,
      Cloud: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" /></svg>
    };

    const CATEGORIES = {
      income: [
        { id: 'Salario', label: 'Salário / Trabalho', color: 'bg-blue-100 text-blue-800' },
        { id: 'Aposentadoria', label: 'Aposentadoria / INSS', color: 'bg-emerald-100 text-emerald-800' },
        { id: 'Pensao', label: 'Pensão / Benefício', color: 'bg-teal-100 text-teal-800' },
        { id: 'Aluguel', label: 'Renda de Aluguel', color: 'bg-indigo-100 text-indigo-800' },
        { id: 'Investimentos', label: 'Rendimentos', color: 'bg-amber-100 text-amber-800' },
        { id: 'OutrasReceitas', label: 'Outras Entradas', color: 'bg-slate-100 text-slate-800' }
      ],
      expense: [
        { id: 'Remedios', label: 'Remédios & Farmácia', color: 'bg-rose-100 text-rose-800' },
        { id: 'Mercado', label: 'Supermercado & Feira', color: 'bg-amber-100 text-amber-800' },
        { id: 'ContasCasa', label: 'Água, Luz e Gás', color: 'bg-orange-100 text-orange-800' },
        { id: 'Moradia', label: 'Aluguel / Condomínio', color: 'bg-indigo-100 text-indigo-800' },
        { id: 'Telefone', label: 'Celular & Internet', color: 'bg-sky-100 text-sky-800' },
        { id: 'Saude', label: 'Plano de Saúde & Exames', color: 'bg-red-100 text-red-800' },
        { id: 'Transporte', label: 'Transporte & Carro', color: 'bg-cyan-100 text-cyan-800' },
        { id: 'OutrasDespesas', label: 'Outros Gastos', color: 'bg-slate-100 text-slate-800' }
      ]
    };

    function App() {
      const [userName, setUserName] = useState(() => localStorage.getItem('usuario_nome') || 'Fernanda');
      const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('familia_codigo') || 'FAM-7481');
      const [inputCode, setInputCode] = useState('');
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [syncStatus, setSyncStatus] = useState('Nuvem Ativa');

      const [transactions, setTransactions] = useState(() => {
        try {
          const saved = localStorage.getItem('planejamento_facil_db');
          return saved ? JSON.parse(saved) : [
            { id: '1', description: 'Entrada Inicial', amount: 12000, type: 'income', category: 'Salario', date: new Date().toISOString().split('T')[0], author: 'Fernanda', isFamily: true }
          ];
        } catch {
          return [];
        }
      });

      const [viewFilter, setViewFilter] = useState('tudo');
      const [zoomLevel, setZoomLevel] = useState('large');
      const [activeTab, setActiveTab] = useState('resumo');

      // Estado do formulário
      const [desc, setDesc] = useState('');
      const [val, setVal] = useState('');
      const [txType, setTxType] = useState('expense');
      const [txCat, setTxCat] = useState('Remedios');
      const [isFamilyScope, setIsFamilyScope] = useState(true);

      // Persistência local imediata
      useEffect(() => {
        localStorage.setItem('planejamento_facil_db', JSON.stringify(transactions));
        localStorage.setItem('usuario_nome', userName);
        localStorage.setItem('familia_codigo', familyCode);
      }, [transactions, userName, familyCode]);

      // Sincronização em Nuvem em Tempo Real (usando endpoint aberto com hash de código)
      const syncWithCloud = async (codeToSync, currentList) => {
        if (!codeToSync) return;
        try {
          const cleanCode = codeToSync.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          const res = await fetch(`https://kvdb.io/6P4k8e7N2XbK9U3wL5qR1/${cleanCode}`, {
            method: 'POST',
            body: JSON.stringify(currentList)
          });
          if (res.ok) {
            setSyncStatus('Sincronizado');
          }
        } catch (e) {
          setSyncStatus('Salvo Local');
        }
      };

      // Leitura da nuvem periódica a cada 4 segundos para receber contas do outro celular
      useEffect(() => {
        if (!familyCode) return;
        const cleanCode = familyCode.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

        const fetchRemote = async () => {
          try {
            const res = await fetch(`https://kvdb.io/6P4k8e7N2XbK9U3wL5qR1/${cleanCode}`);
            if (res.ok) {
              const remoteData = await res.json();
              if (Array.isArray(remoteData) && remoteData.length > 0) {
                setTransactions(remoteData);
                setSyncStatus('Sincronizado');
              }
            }
          } catch (e) {
            // Modo local ativo caso esteja sem rede
          }
        };

        fetchRemote();
        const interval = setInterval(fetchRemote, 4000);
        return () => clearInterval(interval);
      }, [familyCode]);

      const speakText = (text) => {
        if (!audioEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'pt-BR';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        } catch(e) {}
      };

      const generateNewFamilyCode = () => {
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const code = `FAM-${randomNum}`;
        setFamilyCode(code);
        syncWithCloud(code, transactions);
        speakText(`Novo código de família criado: ${code}`);
        alert(`O código da sua família é: ${code}\nColoque este mesmo código no outro celular.`);
      };

      const handleConnectFamily = (e) => {
        e.preventDefault();
        if (!inputCode.trim()) return;
        const code = inputCode.trim().toUpperCase();
        setFamilyCode(code);
        setInputCode('');
        speakText(`Conectado à família ${code}`);
        alert(`Conectado à família: ${code}! Suas contas começarão a sincronizar.`);
      };

      const filteredTransactions = useMemo(() => {
        if (viewFilter === 'meu') {
          return transactions.filter(t => t.author === userName);
        }
        return transactions.filter(t => t.isFamily || t.author === userName);
      }, [transactions, viewFilter, userName]);

      const { totalIncome, totalExpense, balance } = useMemo(() => {
        let inc = 0, exp = 0;
        filteredTransactions.forEach(t => {
          if (t.type === 'income') inc += t.amount;
          else exp += t.amount;
        });
        return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
      }, [filteredTransactions]);

      const formatBRL = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

      // Função de Adicionar - ZERA O FORMULÁRIO E RETORNA AO RESUMO SEM TRAVAR
      const handleAdd = (e) => {
        e.preventDefault();
        const parsed = parseFloat(val.replace(',', '.'));
        if (!desc.trim() || isNaN(parsed) || parsed <= 0) {
          alert('Por favor, digite uma descrição e um valor válido.');
          speakText('Preencha a descrição e um valor válido.');
          return;
        }

        const newTx = {
          id: Date.now().toString(),
          description: desc.trim(),
          amount: parsed,
          type: txType,
          category: txCat,
          date: new Date().toISOString().split('T')[0],
          author: userName,
          isFamily: isFamilyScope
        };

        const updatedList = [newTx, ...transactions];
        setTransactions(updatedList);
        syncWithCloud(familyCode, updatedList);

        // Zera os campos com segurança imediata
        setDesc('');
        setVal('');
        setActiveTab('resumo');
        speakText(`${txType === 'income' ? 'Entrada' : 'Despesa'} de ${formatBRL(parsed)} guardada.`);
      };

      const handleDelete = (id, description) => {
        const updatedList = transactions.filter(t => t.id !== id);
        setTransactions(updatedList);
        syncWithCloud(familyCode, updatedList);
        speakText(`${description} excluído.`);
      };

      const handleHearSummary = () => {
        speakText(`Resumo financeiro. O saldo atual é de ${formatBRL(balance)}. Total de entradas: ${formatBRL(totalIncome)}. Total de saídas: ${formatBRL(totalExpense)}.`);
      };

      const zoomClasses = {
        normal: { container: 'text-sm sm:text-base', cardValue: 'text-2xl sm:text-3xl', button: 'py-2.5 px-3 text-sm' },
        large: { container: 'text-base sm:text-lg', cardValue: 'text-3xl sm:text-4xl', button: 'py-3.5 px-4 text-base font-bold' },
        extra: { container: 'text-lg sm:text-xl', cardValue: 'text-4xl sm:text-5xl', button: 'py-4 px-5 text-lg font-black' }
      }[zoomLevel];

      return (
        <div className={`min-h-screen bg-slate-100 text-slate-900 pb-28 ${zoomClasses.container} overflow-x-hidden w-full`}>
          
          {/* TOPO COM ALTO-FALANTE E STATUS DE NUVEM */}
          <header className="bg-white border-b-2 border-slate-200 sticky top-0 z-40 px-3 py-2.5 shadow-sm w-full">
            <div className="max-w-xl mx-auto flex items-center justify-between gap-2">
              
              <div className="flex items-center gap-2 min-w-0">
                <div className="p-2 bg-emerald-600 text-white rounded-xl shrink-0">
                  <Icons.Wallet />
                </div>
                <div className="min-w-0">
                  <h1 className="font-extrabold text-slate-900 text-base sm:text-lg leading-tight truncate">Finanças Família</h1>
                  <div className="flex flex-wrap items-center gap-1 mt-0.5">
                    <span className="text-[11px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-md truncate max-w-[90px]">
                      {userName}
                    </span>
                    <span className="text-[11px] font-bold text-blue-800 bg-blue-100 px-2 py-0.5 rounded-md">
                      {familyCode}
                    </span>
                    <span className="text-[10px] font-semibold text-slate-500 flex items-center gap-0.5">
                      <Icons.Cloud /> {syncStatus}
                    </span>
                  </div>
                </div>
              </div>

              {/* Botões de Acessibilidade (Zoom + Som) */}
              <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-300 shrink-0">
                <button 
                  onClick={() => setZoomLevel('normal')} 
                  className={`w-7 h-7 flex items-center justify-center rounded-xl text-xs font-bold transition-transform active:scale-90 ${zoomLevel === 'normal' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}
                >
                  A
                </button>
                <button 
                  onClick={() => setZoomLevel('large')} 
                  className={`w-8 h-7 flex items-center justify-center rounded-xl text-sm font-bold transition-transform active:scale-90 ${zoomLevel === 'large' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}
                >
                  A+
                </button>
                <button 
                  onClick={() => setZoomLevel('extra')} 
                  className={`w-9 h-7 flex items-center justify-center rounded-xl text-base font-black transition-transform active:scale-90 ${zoomLevel === 'extra' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}
                >
                  A++
                </button>

                {/* SINO / ALTO-FALANTE RECOLOCADO */}
                <button 
                  onClick={() => {
                    const next = !audioEnabled;
                    setAudioEnabled(next);
                    if (next) speakText('Voz ligada');
                  }} 
                  className={`p-1.5 rounded-xl ml-0.5 transition-transform active:scale-90 ${audioEnabled ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-400'}`}
                  title={audioEnabled ? "Desativar voz" : "Ativar voz"}
                >
                  {audioEnabled ? <Icons.Volume2 /> : <Icons.VolumeX />}
                </button>
              </div>

            </div>
          </header>

          <main className="max-w-xl mx-auto p-3.5 space-y-4 w-full">
            
            {/* Alternador Família vs Apenas Minhas */}
            <div className="flex bg-white p-1 rounded-2xl border-2 border-slate-300 shadow-sm gap-1 w-full">
              <button
                onClick={() => { setViewFilter('tudo'); speakText('Visualizando contas da família'); }}
                className={`flex-1 py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all active:scale-95 ${viewFilter === 'tudo' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600'}`}
              >
                <Icons.Users /> Contas da Família
              </button>
              <button
                onClick={() => { setViewFilter('meu'); speakText(`Visualizando apenas contas de ${userName}`); }}
                className={`flex-1 py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all active:scale-95 ${viewFilter === 'meu' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600'}`}
              >
                <Icons.User /> Apenas Minhas ({userName})
              </button>
            </div>

            {/* ABA: RESUMO */}
            {activeTab === 'resumo' && (
              <div className="space-y-4">
                
                {/* Saldo Principal */}
                <div className={`p-5 rounded-3xl border-2 shadow-sm ${balance >= 0 ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                  <div className="flex justify-between items-center text-slate-600 font-bold text-xs sm:text-sm">
                    <span>Saldo Disponível ({viewFilter === 'tudo' ? 'Família' : userName}):</span>
                  </div>
                  <div className={`mt-2 font-black tracking-tight ${zoomClasses.cardValue} ${balance >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>
                    {formatBRL(balance)}
                  </div>
                </div>

                {/* Cards Entradas e Saídas */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-3.5 rounded-2xl border-2 border-emerald-200 shadow-xs">
                    <span className="text-[11px] sm:text-xs font-bold text-slate-500 block">Total Entradas</span>
                    <span className="font-extrabold text-emerald-600 text-lg sm:text-2xl mt-0.5 block truncate">{formatBRL(totalIncome)}</span>
                  </div>
                  <div className="bg-white p-3.5 rounded-2xl border-2 border-rose-200 shadow-xs">
                    <span className="text-[11px] sm:text-xs font-bold text-slate-500 block">Total Saídas</span>
                    <span className="font-extrabold text-rose-600 text-lg sm:text-2xl mt-0.5 block truncate">{formatBRL(totalExpense)}</span>
                  </div>
                </div>

                {/* Botão de Falar Resumo */}
                <button 
                  onClick={handleHearSummary} 
                  className="w-full bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-center gap-2.5 font-bold transition-transform active:scale-95"
                >
                  <Icons.Volume2 />
                  <span>Ouvir Resumo em Voz Alta</span>
                </button>

                {/* Botão para Nova Conta */}
                <button 
                  onClick={() => setActiveTab('novo')} 
                  className={`w-full bg-slate-900 text-white rounded-2xl flex items-center justify-center gap-2.5 shadow-md hover:bg-slate-800 transition-transform active:scale-95 ${zoomClasses.button}`}
                >
                  <Icons.PlusCircle />
                  <span>Anotar Nova Conta / Dinheiro</span>
                </button>
              </div>
            )}

            {/* ABA: NOVO LANÇAMENTO (CORRIGIDO PARA LIMPAR O FORMULÁRIO SEM TRAVAR) */}
            {activeTab === 'novo' && (
              <div className="bg-white p-5 rounded-3xl border-2 border-slate-300 shadow-sm space-y-4">
                <h2 className="font-black text-slate-900 text-xl sm:text-2xl">Anotar Movimento</h2>

                <div className="grid grid-cols-2 gap-2.5">
                  <button 
                    type="button" 
                    onClick={() => { setTxType('income'); speakText('Entrada'); }} 
                    className={`py-3 rounded-2xl font-black border-2 flex items-center justify-center gap-1.5 transition-transform active:scale-95 ${txType === 'income' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-slate-100 text-slate-700'}`}
                  >
                    + Entrada
                  </button>
                  <button 
                    type="button" 
                    onClick={() => { setTxType('expense'); speakText('Saída'); }} 
                    className={`py-3 rounded-2xl font-black border-2 flex items-center justify-center gap-1.5 transition-transform active:scale-95 ${txType === 'expense' ? 'bg-rose-600 text-white border-rose-700' : 'bg-slate-100 text-slate-700'}`}
                  >
                    - Saída (Gasto)
                  </button>
                </div>

                <form onSubmit={handleAdd} className="space-y-4">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1 text-sm">O que é?</label>
                    <input 
                      type="text" 
                      placeholder="Ex: Farmácia, Mercado, Salário..." 
                      value={desc} 
                      onChange={(e) => setDesc(e.target.value)} 
                      className="w-full p-3.5 border-2 border-slate-300 rounded-2xl text-base font-medium outline-none focus:border-emerald-600" 
                      required
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1 text-sm">Valor (R$)</label>
                    <input 
                      type="number" 
                      step="0.01" 
                      placeholder="0,00" 
                      value={val} 
                      onChange={(e) => setVal(e.target.value)} 
                      className="w-full p-3.5 border-2 border-slate-300 rounded-2xl text-2xl font-black text-slate-900 outline-none focus:border-emerald-600" 
                      required
                    />
                  </div>

                  <div className="p-3.5 bg-slate-50 border-2 border-slate-200 rounded-2xl flex items-center justify-between gap-2">
                    <div>
                      <span className="font-extrabold text-slate-900 block text-sm sm:text-base">Sincronizar com a Família?</span>
                      <span className="text-[11px] sm:text-xs text-slate-500 font-bold block">
                        {isFamilyScope ? 'Todos da família vão ver esta conta' : 'Apenas você verá este lançamento'}
                      </span>
                    </div>
                    <input
                      type="checkbox"
                      checked={isFamilyScope}
                      onChange={(e) => setIsFamilyScope(e.target.checked)}
                      className="w-7 h-7 accent-emerald-600 rounded-lg cursor-pointer shrink-0"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-2 text-sm">Categoria:</label>
                    <div className="grid grid-cols-2 gap-2">
                      {CATEGORIES[txType].map((cat) => (
                        <button 
                          key={cat.id} 
                          type="button" 
                          onClick={() => { setTxCat(cat.id); speakText(cat.label); }} 
                          className={`p-2.5 rounded-xl border-2 text-left text-xs font-bold transition-all active:scale-95 ${txCat === cat.id ? 'border-emerald-600 bg-emerald-50 text-emerald-950 font-black' : 'border-slate-200 bg-slate-50 text-slate-600'}`}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2.5">
                    <button 
                      type="submit" 
                      className={`flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-md transition-transform active:scale-95 ${zoomClasses.button}`}
                    >
                      Salvar
                    </button>
                    <button 
                      type="button" 
                      onClick={() => setActiveTab('resumo')} 
                      className="px-5 py-3 bg-slate-200 text-slate-700 rounded-2xl font-bold transition-transform active:scale-95"
                    >
                      Voltar
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* ABA: HISTÓRICO */}
            {activeTab === 'historico' && (
              <div className="bg-white p-4 sm:p-5 rounded-3xl border-2 border-slate-300 shadow-sm space-y-3">
                <h2 className="font-black text-slate-900 text-xl sm:text-2xl">Lançamentos</h2>
                <div className="divide-y-2 divide-slate-100">
                  {filteredTransactions.map((tx) => (
                    <div key={tx.id} className="py-3 flex items-center justify-between gap-2">
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <p className="font-extrabold text-slate-900 text-sm sm:text-base truncate">{tx.description}</p>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${tx.isFamily ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}`}>
                            {tx.isFamily ? 'Família' : 'Pessoal'}
                          </span>
                        </div>
                        <span className="text-[11px] font-bold text-slate-500 block">
                          {tx.date} • Por: {tx.author || 'Eu'}
                        </span>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        <span className={`font-black text-base sm:text-lg ${tx.type === 'income' ? 'text-emerald-700' : 'text-rose-700'}`}>
                          {tx.type === 'income' ? '+' : '-'} {formatBRL(tx.amount)}
                        </span>
                        <button 
                          onClick={() => handleDelete(tx.id, tx.description)} 
                          className="p-2 text-slate-400 hover:text-rose-600 transition-transform active:scale-90"
                          title="Excluir"
                        >
                          <Icons.Trash2 />
                        </button>
                      </div>
                    </div>
                  ))}
                  {filteredTransactions.length === 0 && (
                    <p className="text-center py-6 text-slate-400 text-sm font-semibold">Nenhuma conta cadastrada ainda.</p>
                  )}
                </div>
              </div>
            )}

            {/* ABA: FAMÍLIA & CONEXÃO */}
            {activeTab === 'familia' && (
              <div className="bg-white p-5 rounded-3xl border-2 border-slate-300 shadow-sm space-y-5">
                <div>
                  <h2 className="font-black text-slate-900 text-xl sm:text-2xl">Perfis & Código da Família</h2>
                  <p className="text-slate-600 text-xs sm:text-sm mt-1">
                    Basta colocar o mesmo código nos dois celulares para sincronizarem pela internet!
                  </p>
                </div>

                {/* Perfil Pessoal */}
                <div className="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl space-y-2.5">
                  <h3 className="font-bold text-slate-900 text-base sm:text-lg flex items-center gap-2">
                    <Icons.User /> Meu Nome no Aparelho:
                  </h3>
                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={userName}
                      onChange={(e) => setUserName(e.target.value)}
                      placeholder="Ex: Fernanda, João..."
                      className="w-full p-3 border-2 border-slate-300 rounded-xl font-bold text-base outline-none focus:border-emerald-600"
                    />
                    <button
                      onClick={() => { 
                        alert('Nome salvo!'); 
                        speakText(`Nome alterado para ${userName}`); 
                      }}
                      className="w-full sm:w-auto px-5 py-3 bg-slate-900 text-white font-bold rounded-xl transition-transform active:scale-95 shrink-0"
                    >
                      Guardar
                    </button>
                  </div>
                </div>

                {/* Código de Família */}
                <div className="p-4 bg-emerald-50 border-2 border-emerald-300 rounded-2xl space-y-2.5">
                  <h3 className="font-bold text-emerald-950 text-base sm:text-lg flex items-center gap-2">
                    <Icons.Key /> 1. Código da Sua Família
                  </h3>
                  <p className="text-xs text-slate-700">
                    Digite este mesmo código no outro celular para verem as mesmas contas:
                  </p>
                  <div className="p-3 bg-white border-2 border-emerald-400 rounded-xl flex items-center justify-between">
                    <span className="text-xl font-black text-emerald-800 tracking-wider">{familyCode}</span>
                    <button 
                      onClick={generateNewFamilyCode} 
                      className="text-xs text-emerald-700 font-bold underline p-1 active:scale-90"
                    >
                      Gerar Outro
                    </button>
                  </div>
                </div>

                {/* Conectar a Outro Aparelho */}
                <div className="p-4 bg-blue-50 border-2 border-blue-300 rounded-2xl space-y-2.5">
                  <h3 className="font-bold text-blue-950 text-base sm:text-lg flex items-center gap-2">
                    <Icons.Users /> 2. Conectar a Outro Celular
                  </h3>
                  <p className="text-xs text-slate-700">
                    Se o outro celular já possui um código, digite-o aqui para se juntarem:
                  </p>
                  <form onSubmit={handleConnectFamily} className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      placeholder="Ex: FAM-7481"
                      value={inputCode}
                      onChange={(e) => setInputCode(e.target.value)}
                      className="w-full p-3 border-2 border-blue-300 rounded-xl font-mono font-bold uppercase text-base outline-none"
                    />
                    <button 
                      type="submit" 
                      className="w-full sm:w-auto px-6 py-3 bg-blue-700 text-white font-bold rounded-xl shadow-sm transition-transform active:scale-95 shrink-0"
                    >
                      Conectar
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* BARRA INFERIOR RESPONSIVA */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-300 p-1.5 z-40 shadow-lg">
            <div className="max-w-xl mx-auto grid grid-cols-4 gap-1">
              <button 
                onClick={() => { setActiveTab('resumo'); speakText('Resumo'); }} 
                className={`flex flex-col items-center py-2 rounded-2xl transition-all active:scale-90 ${activeTab === 'resumo' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}
              >
                <Icons.Wallet />
                <span className="text-[11px] sm:text-xs mt-0.5">Resumo</span>
              </button>
              <button 
                onClick={() => { setActiveTab('novo'); speakText('Anotar'); }} 
                className={`flex flex-col items-center py-2 rounded-2xl transition-all active:scale-90 ${activeTab === 'novo' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}
              >
                <Icons.PlusCircle />
                <span className="text-[11px] sm:text-xs mt-0.5">+ Anotar</span>
              </button>
              <button 
                onClick={() => { setActiveTab('historico'); speakText('Contas'); }} 
                className={`flex flex-col items-center py-2 rounded-2xl transition-all active:scale-90 ${activeTab === 'historico' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}
              >
                <Icons.Calendar />
                <span className="text-[11px] sm:text-xs mt-0.5">Contas</span>
              </button>
              <button 
                onClick={() => { setActiveTab('familia'); speakText('Família'); }} 
                className={`flex flex-col items-center py-2 rounded-2xl transition-all active:scale-90 ${activeTab === 'familia' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}
              >
                <Icons.Users />
                <span className="text-[11px] sm:text-xs mt-0.5">Família</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
