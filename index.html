<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Planejamento Financeiro Fácil & Família</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }
    button, input, select {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root">
    <div style="padding: 24px; text-align: center; font-weight: bold; color: #475569;">
      Carregando Sistema Financeiro...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    if (window.pdfjsLib) {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      } catch (e) {}
    }

    const Icons = {
      Wallet: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>,
      TrendingUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      TrendingDown: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" /></svg>,
      Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
      Volume2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,
      VolumeX: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>,
      PlusCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Trash2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Mic: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>,
      Camera: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Piggy: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
      ShieldCheck: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
      Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
    };

    const CATEGORIES = {
      income: [
        { id: 'Salario', label: 'Salário / Trabalho' },
        { id: 'Aposentadoria', label: 'Aposentadoria / INSS' },
        { id: 'Pensao', label: 'Pensão / Benefício' },
        { id: 'Aluguel', label: 'Aluguel Recebido' },
        { id: 'Investimentos', label: 'Rendimentos' },
        { id: 'OutrasReceitas', label: 'Outras Entradas' }
      ],
      expense: [
        { id: 'Remedios', label: 'Remédios & Farmácia' },
        { id: 'Mercado', label: 'Supermercado & Feira' },
        { id: 'ContasCasa', label: 'Água, Luz e Gás' },
        { id: 'Moradia', label: 'Aluguel / Condomínio' },
        { id: 'Telefone', label: 'Celular & Internet' },
        { id: 'Saude', label: 'Plano de Saúde' },
        { id: 'Transporte', label: 'Transporte & Carro' },
        { id: 'OutrasDespesas', label: 'Outros Gastos' }
      ]
    };

    function formatCurrencyMask(value) {
      if (!value) return '';
      const onlyDigits = String(value).replace(/\D/g, '');
      if (!onlyDigits) return '';
      const numberValue = parseFloat(onlyDigits) / 100;
      return numberValue.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function parseMaskedCurrency(formattedString) {
      if (!formattedString) return 0;
      const onlyDigits = String(formattedString).replace(/\D/g, '');
      if (!onlyDigits) return 0;
      return parseFloat(onlyDigits) / 100;
    }

    function getDeviceId() {
      let id = localStorage.getItem('device_fingerprint_id');
      if (!id) {
        id = 'DEV_' + Math.random().toString(36).substring(2, 9).toUpperCase();
        localStorage.setItem('device_fingerprint_id', id);
      }
      return id;
    }

    function App() {
      const myDeviceId = useMemo(() => getDeviceId(), []);

      const [userName, setUserName] = useState(() => localStorage.getItem('usuario_nome') || 'Fernanda');
      const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('familia_codigo') || 'FAM-7481');
      const [isOwner, setIsOwner] = useState(() => {
        const stored = localStorage.getItem(`is_owner_${familyCode}`);
        return stored !== null ? stored === 'true' : true;
      });
      const [deviceStatus, setDeviceStatus] = useState(() => localStorage.getItem(`status_dev_${familyCode}`) || 'APPROVED');

      // Membros autorizados e solicitações pendentes
      const [pendingRequests, setPendingRequests] = useState([]);
      const [approvedDevices, setApprovedDevices] = useState([]);

      const [editFamilyInput, setEditFamilyInput] = useState('');
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [syncStatus, setSyncStatus] = useState('Online');
      const [isSyncing, setIsSyncing] = useState(false);

      const [currentMode, setCurrentMode] = useState('familia');

      const [personalTx, setPersonalTx] = useState(() => {
        try {
          const s = localStorage.getItem('contas_pessoais_db');
          return s ? JSON.parse(s) : [];
        } catch (e) { return []; }
      });

      const [familyTx, setFamilyTx] = useState(() => {
        try {
          const s = localStorage.getItem(`contas_fam_${familyCode}`);
          return s ? JSON.parse(s) : [];
        } catch (e) { return []; }
      });

      const [investments, setInvestments] = useState(() => {
        try {
          const s = localStorage.getItem('planejamento_investimentos_db');
          return s ? JSON.parse(s) : [
            { id: 'i1', name: 'Tesouro Selic 2029', type: 'Renda Fixa', amount: 100000, yieldRate: '10.75% a.a.' }
          ];
        } catch (e) { return []; }
      });

      const [invName, setInvName] = useState('');
      const [invAmount, setInvAmount] = useState('');
      const [invType, setInvType] = useState('Renda Fixa');
      const [invYield, setInvYield] = useState('100% CDI');

      const [zoomLevel, setZoomLevel] = useState('large');
      const [activeTab, setActiveTab] = useState('resumo');

      const [desc, setDesc] = useState('');
      const [val, setVal] = useState('');
      const [txType, setTxType] = useState('expense');
      const [txCat, setTxCat] = useState('Remedios');

      const [isListening, setIsListening] = useState(false);
      const [isProcessingDoc, setIsProcessingDoc] = useState(false);
      const [docStatus, setDocStatus] = useState('');

      // Persistência local
      useEffect(() => {
        try {
          localStorage.setItem('contas_pessoais_db', JSON.stringify(personalTx));
          localStorage.setItem(`contas_fam_${familyCode}`, JSON.stringify(familyTx));
          localStorage.setItem('planejamento_investimentos_db', JSON.stringify(investments));
          localStorage.setItem('usuario_nome', userName);
          localStorage.setItem('familia_codigo', familyCode);
          localStorage.setItem(`is_owner_${familyCode}`, String(isOwner));
          localStorage.setItem(`status_dev_${familyCode}`, deviceStatus);
        } catch (e) {}
      }, [personalTx, familyTx, investments, userName, familyCode, isOwner, deviceStatus]);

      // NUVEM: Barramento Seguro com Autenticação de Dispositivos
      const pushToCloud = async (code, list, pending = pendingRequests, approved = approvedDevices) => {
        if (!code) return;
        setIsSyncing(true);
        try {
          const clean = code.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          const payload = {
            transactions: list,
            pending: pending,
            approved: approved,
            ownerDevice: isOwner ? myDeviceId : undefined,
            updatedAt: Date.now()
          };
          localStorage.setItem(`cloud_channel_${clean}`, JSON.stringify(payload));
          setSyncStatus('Sincronizado');
        } catch (e) {
          setSyncStatus('Local');
        } finally {
          setIsSyncing(false);
        }
      };

      const pullFromCloud = (code, notify = false) => {
        const target = code || familyCode;
        if (!target) return;
        setIsSyncing(true);
        try {
          const clean = target.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          const raw = localStorage.getItem(`cloud_channel_${clean}`);
          if (raw) {
            const data = JSON.parse(raw);
            if (data) {
              if (Array.isArray(data.transactions) && (isOwner || deviceStatus === 'APPROVED')) {
                setFamilyTx(data.transactions);
              }
              if (Array.isArray(data.pending)) setPendingRequests(data.pending);
              if (Array.isArray(data.approved)) {
                setApprovedDevices(data.approved);
                if (data.approved.some(d => d.id === myDeviceId)) {
                  setDeviceStatus('APPROVED');
                }
              }
              setSyncStatus('Atualizado');
              if (notify) speakText('Dados da família sincronizados.');
            }
          }
        } catch (e) {}
        finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        pullFromCloud(familyCode);
        const timer = setInterval(() => pullFromCloud(familyCode), 3000);
        return () => clearInterval(timer);
      }, [familyCode, isOwner, deviceStatus]);

      // AÇÃO 1: CRIAR NOVA FAMÍLIA (O usuário vira Titular com Acesso Total)
      const handleCreateNewFamily = () => {
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const newCode = `FAM-${randomNum}`;
        setFamilyCode(newCode);
        setIsOwner(true);
        setDeviceStatus('APPROVED');
        setPendingRequests([]);
        setApprovedDevices([{ id: myDeviceId, name: userName, role: 'TITULAR' }]);
        setFamilyTx([]);
        pushToCloud(newCode, [], [], [{ id: myDeviceId, name: userName, role: 'TITULAR' }]);
        speakText(`Nova família criada com o código ${newCode}. Você é o titular.`);
        alert(`Nova Família Criada com Sucesso!\nCódigo: ${newCode}\nVocê é o Titular e aprovará as entradas.`);
      };

      // AÇÃO 2: ENTRAR EM FAMÍLIA EXISTENTE (Exige aprovação do Titular)
      const handleRequestJoinFamily = (codeToJoin) => {
        const clean = (codeToJoin || editFamilyInput).trim().toUpperCase();
        if (!clean) {
          alert('Digite o código da família para entrar.');
          return;
        }

        // Se o código for o mesmo e já for titular
        if (clean === familyCode && isOwner) {
          alert('Você já é o Titular desta família.');
          return;
        }

        setFamilyCode(clean);
        setIsOwner(false);
        setDeviceStatus('PENDING'); // Bloqueado até o titular aprovar
        setFamilyTx([]); // Limpa as contas antigas da tela

        // Registra solicitação na nuvem para o titular ver
        const newReq = { id: myDeviceId, name: userName, date: new Date().toLocaleTimeString('pt-BR') };
        const cleanChan = clean.replace(/[^A-Z0-9]/g, '');
        let currentChan = {};
        try {
          const raw = localStorage.getItem(`cloud_channel_${cleanChan}`);
          if (raw) currentChan = JSON.parse(raw);
        } catch(e) {}

        const updatedPending = [...(currentChan.pending || []).filter(p => p.id !== myDeviceId), newReq];
        localStorage.setItem(`cloud_channel_${cleanChan}`, JSON.stringify({
          ...currentChan,
          pending: updatedPending
        }));

        setPendingRequests(updatedPending);
        setEditFamilyInput('');
        speakText('Solicitação enviada. Aguardando aprovação do titular.');
        alert(`Solicitação enviada ao Titular da família ${clean}!\nAssim que ele aprovar no celular dele, suas contas vão aparecer.`);
      };

      // AÇÃO 3: TITULAR APROVA ENTRADA DE DISPOSITIVO
      const handleApproveDevice = (req) => {
        const updatedPending = pendingRequests.filter(p => p.id !== req.id);
        const updatedApproved = [...approvedDevices.filter(d => d.id !== req.id), { id: req.id, name: req.name, role: 'MEMBRO' }];
        setPendingRequests(updatedPending);
        setApprovedDevices(updatedApproved);
        pushToCloud(familyCode, familyTx, updatedPending, updatedApproved);
        speakText(`Acesso aprovado para ${req.name}`);
        alert(`O dispositivo de ${req.name} foi APROVADO e já tem acesso às contas.`);
      };

      // AÇÃO 4: TITULAR RECUSA ENTRADA
      const handleRejectDevice = (req) => {
        const updatedPending = pendingRequests.filter(p => p.id !== req.id);
        setPendingRequests(updatedPending);
        pushToCloud(familyCode, familyTx, updatedPending, approvedDevices);
        speakText(`Solicitação de ${req.name} recusada.`);
      };

      const speakText = (text) => {
        if (!audioEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'pt-BR';
          u.rate = 0.95;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      };

      const formatBRL = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

      const currentTransactions = currentMode === 'pessoal' ? personalTx : familyTx;

      const { totalIncome, totalExpense, balance } = useMemo(() => {
        let inc = 0, exp = 0;
        currentTransactions.forEach(t => {
          if (t.type === 'income') inc += Number(t.amount || 0);
          else exp += Number(t.amount || 0);
        });
        return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
      }, [currentTransactions]);

      const totalInvested = useMemo(() => {
        return investments.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
      }, [investments]);

      const handleAdd = (e) => {
        e.preventDefault();
        const parsed = parseMaskedCurrency(val);
        if (!desc.trim() || isNaN(parsed) || parsed <= 0) {
          alert('Preencha a descrição e um valor válido.');
          return;
        }

        const newTx = {
          id: Date.now().toString(),
          description: desc.trim(),
          amount: parsed,
          type: txType,
          category: txCat,
          date: new Date().toISOString().split('T')[0],
          author: userName
        };

        if (currentMode === 'pessoal') {
          setPersonalTx([newTx, ...personalTx]);
        } else {
          if (!isOwner && deviceStatus !== 'APPROVED') {
            alert('Aguarde o Titular aprovar este dispositivo para lançar nas contas da família.');
            return;
          }
          const updated = [newTx, ...familyTx];
          setFamilyTx(updated);
          pushToCloud(familyCode, updated);
        }

        setDesc('');
        setVal('');
        setActiveTab('resumo');
        speakText(`${txType === 'income' ? 'Entrada' : 'Despesa'} de ${formatBRL(parsed)} adicionada.`);
      };

      const handleDelete = (id, description) => {
        if (currentMode === 'pessoal') {
          setPersonalTx(personalTx.filter(t => t.id !== id));
        } else {
          const updated = familyTx.filter(t => t.id !== id);
          setFamilyTx(updated);
          pushToCloud(familyCode, updated);
        }
        speakText(`${description} excluído.`);
      };

      const handleAddInvestment = (e) => {
        e.preventDefault();
        const parsed = parseMaskedCurrency(invAmount);
        if (!invName.trim() || isNaN(parsed) || parsed <= 0) {
          alert('Preencha o nome e um valor válido.');
          return;
        }

        const newInv = {
          id: Date.now().toString(),
          name: invName.trim(),
          amount: parsed,
          type: invType,
          yieldRate: invYield || '100% CDI'
        };

        setInvestments([...investments, newInv]);
        setInvName('');
        setInvAmount('');
        speakText(`Investimento de ${formatBRL(parsed)} registrado.`);
      };

      const handleVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Reconhecimento de voz não suportado neste navegador. Use o Google Chrome.');
          return;
        }

        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const text = event.results[0][0].transcript.toLowerCase();
          setIsListening(false);

          let type = 'expense';
          if (text.includes('ganhei') || text.includes('recebi') || text.includes('salário') || text.includes('aposentadoria')) {
            type = 'income';
          }

          let cat = 'OutrasDespesas';
          if (text.includes('remédio') || text.includes('farmácia')) cat = 'Remedios';
          else if (text.includes('mercado') || text.includes('compras')) cat = 'Mercado';
          else if (text.includes('luz') || text.includes('água')) cat = 'ContasCasa';

          setDesc(text.charAt(0).toUpperCase() + text.slice(1));
          setTxType(type);
          setTxCat(cat);
          setActiveTab('novo');
          speakText(`Reconhecido: ${text}. Digite o valor e confirme.`);
        };
        recognition.onerror = () => setIsListening(false);
        recognition.start();
      };

      const handleFileScan = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessingDoc(true);
        setDocStatus('Lendo documento...');

        try {
          let fullText = '';
          if (file.type === 'application/pdf') {
            const fileReader = new FileReader();
            fileReader.onload = async function () {
              try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
                  const page = await pdf.getPage(i);
                  const textContent = await page.getTextContent();
                  fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                }
                processDocText(fullText, file.name);
              } catch (err) {
                setIsProcessingDoc(false);
                alert('Erro ao processar PDF.');
              }
            };
            fileReader.readAsArrayBuffer(file);
          } else {
            const result = await Tesseract.recognize(file, 'por');
            fullText = result.data.text;
            processDocText(fullText, file.name);
          }
        } catch (err) {
          setIsProcessingDoc(false);
          setDocStatus('');
          alert('Erro ao processar imagem.');
        }
      };

      const processDocText = (text, fileName) => {
        setIsProcessingDoc(false);
        setDocStatus('');

        const matches = text.match(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})/gi);
        let finalVal = 0;
        if (matches && matches.length > 0) {
          const cleanVals = matches.map(m => {
            let clean = m.replace('R$', '').trim();
            if (clean.includes('.') && clean.includes(',')) clean = clean.replace(/\./g, '').replace(',', '.');
            else if (clean.includes(',')) clean = clean.replace(',', '.');
            return parseFloat(clean);
          }).filter(n => !isNaN(n));
          if (cleanVals.length > 0) finalVal = Math.max(...cleanVals);
        }

        setDesc(`Extrato: ${fileName.replace(/\.[^/.]+$/, "")}`);
        if (finalVal > 0) {
          setVal(finalVal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
        }
        setActiveTab('novo');
        speakText('Documento lido com sucesso.');
      };

      const zoomClasses = {
        normal: { container: 'text-sm sm:text-base', cardValue: 'text-2xl sm:text-3xl', button: 'py-2.5 px-3 text-sm' },
        large: { container: 'text-base sm:text-lg', cardValue: 'text-3xl sm:text-4xl', button: 'py-3.5 px-4 text-base font-bold' },
        extra: { container: 'text-lg sm:text-xl', cardValue: 'text-4xl sm:text-5xl', button: 'py-4 px-5 text-lg font-black' }

      return (
        <div className={`min-h-screen bg-slate-100 text-slate-900 pb-28 ${zoomClasses.container} overflow-x-hidden w-full`}>

            <div className="max-w-xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                <div className={`p-2 text-white rounded-xl shrink-0 ${currentMode === 'pessoal' ? 'bg-indigo-600' : 'bg-emerald-600'}`}>
                  {currentMode === 'pessoal' ? <Icons.User /> : <Icons.Users />}
                </div>
                <div className="min-w-0">

                    <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md ${isOwner ? 'bg-purple-100 text-purple-800' : (deviceStatus === 'APPROVED' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800')}`}>

            {/* AVISO DE DISPOSITIVO PENDENTE DE APROVAÇÃO PELO TITULAR */}

                  Verificar se já fui aprovado

            {/* PAINEL DE SEGURANÇA EXCLUSIVO DO TITULAR: APROVAÇÕES PENDENTES */}

            {/* ABA: INVESTIMENTOS */}
            {activeTab === 'investimentos' && (
              <div className="bg-white p-5 rounded-3xl border-2 border-slate-300 shadow-sm space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-black text-slate-900 text-xl">Carteira de Investimentos</h2>
                  <span className="p-2 bg-amber-100 text-amber-800 rounded-xl"><Icons.Piggy /></span>
                </div>

                <div className="p-4 bg-gradient-to-r from-amber-500 to-amber-700 text-white rounded-2xl shadow-sm">
                  <span className="text-xs font-bold uppercase tracking-wider block opacity-90">Total Investido</span>
                  <span className="text-3xl font-black mt-1 block">{formatBRL(totalInvested)}</span>
                  <span className="text-xs mt-1 block opacity-95">Rendimento estimado: ~ R$ {(totalInvested * 0.0085).toFixed(2)} / mês</span>
                </div>

                <form onSubmit={handleAddInvestment} className="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                  <h3 className="font-bold text-sm text-slate-800">Adicionar Investimento</h3>
                  <input 
                    type="text" 
                    placeholder="Nome (Ex: Tesouro Selic, CDB Inter)"

                  <div className="grid grid-cols-2 gap-2">
                    <div className="relative">
                      <span className="absolute left-3 top-2.5 text-xs font-bold text-slate-400">R$</span>
                      <input

                <div className="p-4 bg-blue-50 border-2 border-blue-300 rounded-2xl space-y-3">
                  <h3 className="font-extrabold text-blue-950 text-sm flex items-center gap-1.5">
                    <Icons.Lock /> Entrar em Outra Família com Código
                  </h3>
                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      placeholder="Digite o código (Ex: FAM-1234)"
                      value={editFamilyInput}
                      onChange={(e) => setEditFamilyInput(e.target.value.toUpperCase())}
                      className="flex-1 p-3 border-2 border-blue-300 bg-white rounded-xl font-mono font-bold text-base uppercase outline-none"
                    />
                    <button
                      onClick={() => handleRequestJoinFamily(editFamilyInput)}
                      className="px-5 py-3 bg-blue-700 text-white font-bold rounded-xl text-xs sm:text-sm active:scale-95 shadow-sm"
                    >
                      Solicitar Entrada
                    </button>
                  </div>
                  <span className="text-[10px] text-blue-700 block">
                    * Ao clicar em Solicitar Entrada, o aparelho do titular daquela família receberá um aviso para aprovar você.
                  </span>
                </div>

                {/* CRIAR UMA NOVA FAMÍLIA DO ZERO */}
                <div className="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl flex items-center justify-between gap-2">
                  <div>
                    <h4 className="font-bold text-slate-800 text-sm">Quer começar do zero?</h4>
                    <span className="text-xs text-slate-500">Crie um novo código e torne-se o titular.</span>
                  </div>
                  <button
                    onClick={handleCreateNewFamily}
                    className="px-4 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-xs active:scale-95 shadow-sm shrink-0"
                  >
                    Criar Nova Família
                  </button>
                </div>

              </div>
            )}
          </main>

          {/* BARRA INFERIOR */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-300 p-1.5 z-40 shadow-lg">
            <div className="max-w-xl mx-auto grid grid-cols-5 gap-1">
              <button onClick={() => setActiveTab('resumo')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'resumo' ? 'bg-slate-900 text-white font-extrabold' : 'text-slate-600'}`}>
                <Icons.Wallet />
                <span className="text-[10px] mt-0.5">Resumo</span>
              </button>
              <button onClick={() => setActiveTab('novo')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'novo' ? 'bg-slate-900 text-white font-extrabold' : 'text-slate-600'}`}>
                <Icons.PlusCircle />
                <span className="text-[10px] mt-0.5">+ Anotar</span>
              </button>
              <button onClick={() => setActiveTab('investimentos')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'investimentos' ? 'bg-slate-900 text-white font-extrabold' : 'text-slate-600'}`}>
                <Icons.Piggy />
                <span className="text-[10px] mt-0.5">Investir</span>
              </button>
              <button onClick={() => setActiveTab('historico')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'historico' ? 'bg-slate-900 text-white font-extrabold' : 'text-slate-600'}`}>
                <Icons.Calendar />
                <span className="text-[10px] mt-0.5">Contas</span>
              </button>
              <button onClick={() => setActiveTab('familia')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'familia' ? 'bg-slate-900 text-white font-extrabold' : 'text-slate-600'}`}>
                <Icons.Users />
                <span className="text-[10px] mt-0.5">Família</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
