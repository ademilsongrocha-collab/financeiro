<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Planejamento Financeiro Fácil & Família</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leitor de PDF e OCR de Fotos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }
    button, input, select {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    const Icons = {
      Wallet: () => <svg className="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>,
      TrendingUp: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      TrendingDown: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" /></svg>,
      Users: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      User: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
      Volume2: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,
      VolumeX: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>,
      PlusCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Trash2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Mic: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>,
      Camera: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Piggy: () => <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    };

    const CATEGORIES = {
      income: [
        { id: 'Salario', label: 'Salário / Trabalho' },
        { id: 'Aposentadoria', label: 'Aposentadoria / INSS' },
        { id: 'Pensao', label: 'Pensão / Benefício' },
        { id: 'Aluguel', label: 'Aluguel Recebido' },
        { id: 'Investimentos', label: 'Rendimentos' },
        { id: 'OutrasReceitas', label: 'Outras Entradas' }
      ],
      expense: [
        { id: 'Remedios', label: 'Remédios & Farmácia' },
        { id: 'Mercado', label: 'Supermercado & Feira' },
        { id: 'ContasCasa', label: 'Água, Luz e Gás' },
        { id: 'Moradia', label: 'Aluguel / Condomínio' },
        { id: 'Telefone', label: 'Celular & Internet' },
        { id: 'Saude', label: 'Plano de Saúde' },
        { id: 'Transporte', label: 'Transporte & Carro' },
        { id: 'OutrasDespesas', label: 'Outros Gastos' }
      ]
    };

    // FORMATAÇÃO E MÁSCARA MONETÁRIA BRASILEIRA (ex: 10000000 -> 100.000,00)
    function formatCurrencyMask(value) {
      if (!value) return '';
      const onlyDigits = String(value).replace(/\D/g, '');
      if (!onlyDigits) return '';
      const numberValue = parseFloat(onlyDigits) / 100;
      return numberValue.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function parseMaskedCurrency(formattedString) {
      if (!formattedString) return 0;
      const onlyDigits = String(formattedString).replace(/\D/g, '');
      if (!onlyDigits) return 0;
      return parseFloat(onlyDigits) / 100;
    }

    function parseSpokenAmount(text) {
      let t = text.toLowerCase().replace(/r\$/g, '').trim();

      if (t.includes('milhão') || t.includes('milhões')) {
        let m = t.match(/(\d+([,\.]\d+)?)\s*milh/);
        if (m) return parseFloat(m[1].replace(',', '.')) * 1000000;
        if (t.includes('um milhão')) return 1000000;
      }

      if (t.includes('mil')) {
        let m = t.match(/(\d+([,\.]\d+)?)\s*mil/);
        if (m) return parseFloat(m[1].replace(',', '.')) * 1000;
        if (t.includes('cem mil') || t.includes('100 mil')) return 100000;
        if (t.includes('duzentos mil') || t.includes('200 mil')) return 200000;
        if (t.includes('trezentos mil') || t.includes('300 mil')) return 300000;
        if (t.includes('quatrocentos mil') || t.includes('400 mil')) return 400000;
        if (t.includes('quinhentos mil') || t.includes('500 mil')) return 500000;
        if (t.includes('cinquenta mil') || t.includes('50 mil')) return 50000;
        if (t.includes('dez mil') || t.includes('10 mil')) return 10000;
        if (t.includes('vinte mil') || t.includes('20 mil')) return 20000;
        if (t.includes('trinta mil') || t.includes('30 mil')) return 30000;
      }

      const regex = /(\d{1,3}(?:\.\d{3})*,\d{2})|(\d+([,\.]\d+)?)/;
      const match = t.match(regex);
      if (match) {
        let clean = match[0].trim();
        if (clean.includes('.') && clean.includes(',')) {
          clean = clean.replace(/\./g, '').replace(',', '.');
        } else if (clean.includes(',')) {
          clean = clean.replace(',', '.');
        }
        return parseFloat(clean);
      }
      return NaN;
    }

    function App() {
      const [userName, setUserName] = useState(() => localStorage.getItem('usuario_nome') || 'Fernanda');
      const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('familia_codigo') || 'FAM-7481');
      const [audioEnabled, setAudioEnabled] = useState(true);

      const [currentMode, setCurrentMode] = useState(() => localStorage.getItem('modo_selecionado') || 'pessoal');

      const [personalTx, setPersonalTx] = useState(() => {
        try {
          const s = localStorage.getItem('contas_pessoais_db');
          return s ? JSON.parse(s) : [
            { id: 'p1', description: 'Meu Salário', amount: 100000, type: 'income', category: 'Salario', date: new Date().toISOString().split('T')[0] }
          ];
        } catch { return []; }
      });

      const [familyTx, setFamilyTx] = useState(() => {
        try {
          const s = localStorage.getItem('contas_familia_db');
          return s ? JSON.parse(s) : [
            { id: 'f1', description: 'Compra de Imóvel / Reforma', amount: 150000, type: 'expense', category: 'Moradia', date: new Date().toISOString().split('T')[0], author: 'Fernanda' }
          ];
        } catch { return []; }
      });

      const [investments, setInvestments] = useState(() => {
        try {
          const s = localStorage.getItem('planejamento_investimentos_db');
          return s ? JSON.parse(s) : [
            { id: 'i1', name: 'Tesouro Selic 2029', type: 'Renda Fixa', amount: 100000, yieldRate: '10.75% a.a.' }
          ];
        } catch { return []; }
      });

      const [invName, setInvName] = useState('');
      const [invAmount, setInvAmount] = useState('');
      const [invType, setInvType] = useState('Renda Fixa');
      const [invYield, setInvYield] = useState('100% CDI');

      const [zoomLevel, setZoomLevel] = useState('large');
      const [activeTab, setActiveTab] = useState('resumo');

      // Formulário
      const [desc, setDesc] = useState('');
      const [val, setVal] = useState('');
      const [txType, setTxType] = useState('expense');
      const [txCat, setTxCat] = useState('Remedios');

      const [isListening, setIsListening] = useState(false);
      const [isProcessingDoc, setIsProcessingDoc] = useState(false);
      const [docStatus, setDocStatus] = useState('');

      useEffect(() => {
        localStorage.setItem('contas_pessoais_db', JSON.stringify(personalTx));
        localStorage.setItem('contas_familia_db', JSON.stringify(familyTx));
        localStorage.setItem('planejamento_investimentos_db', JSON.stringify(investments));
        localStorage.setItem('usuario_nome', userName);
        localStorage.setItem('familia_codigo', familyCode);
        localStorage.setItem('modo_selecionado', currentMode);
      }, [personalTx, familyTx, investments, userName, familyCode, currentMode]);

      const syncFamilyWithCloud = async (code, list) => {
        if (!code) return;
        try {
          const clean = code.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          await fetch(`https://kvdb.io/6P4k8e7N2XbK9U3wL5qR1/${clean}`, {
            method: 'POST',
            body: JSON.stringify(list)
          });
        } catch (e) {}
      };

      useEffect(() => {
        if (!familyCode) return;
        const clean = familyCode.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

        const fetchRemote = async () => {
          try {
            const res = await fetch(`https://kvdb.io/6P4k8e7N2XbK9U3wL5qR1/${clean}`);
            if (res.ok) {
              const remote = await res.json();
              if (Array.isArray(remote)) {
                setFamilyTx(remote);
              }
            }
          } catch (e) {}
        };

        fetchRemote();
        const interval = setInterval(fetchRemote, 4000);
        return () => clearInterval(interval);
      }, [familyCode]);

      const speakText = (text) => {
        if (!audioEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'pt-BR';
          u.rate = 0.95;
          window.speechSynthesis.speak(u);
        } catch(e) {}
      };

      const formatBRL = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

      const currentTransactions = currentMode === 'pessoal' ? personalTx : familyTx;

      const { totalIncome, totalExpense, balance } = useMemo(() => {
        let inc = 0, exp = 0;
        currentTransactions.forEach(t => {
          if (t.type === 'income') inc += t.amount;
          else exp += t.amount;
        });
        return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
      }, [currentTransactions]);

      const totalInvested = useMemo(() => {
        return investments.reduce((acc, curr) => acc + curr.amount, 0);
      }, [investments]);

      const handleToggleMode = (mode) => {
        setCurrentMode(mode);
        if (mode === 'pessoal') {
          speakText(`Modo pessoal de ${userName}`);
        } else {
          speakText(`Modo família`);
        }
      };

      // Handler com máscara ao digitar valor
      const handleAmountChange = (e) => {
        const rawValue = e.target.value;
        const formatted = formatCurrencyMask(rawValue);
        setVal(formatted);
      };

      const handleInvAmountChange = (e) => {
        const rawValue = e.target.value;
        const formatted = formatCurrencyMask(rawValue);
        setInvAmount(formatted);
      };

      // Adicionar Transação
      const handleAdd = (e) => {
        e.preventDefault();
        const parsed = parseMaskedCurrency(val);
        if (!desc.trim() || isNaN(parsed) || parsed <= 0) {
          alert('Preencha a descrição e um valor válido.');
          return;
        }

        const newTx = {
          id: Date.now().toString(),
          description: desc.trim(),
          amount: parsed,
          type: txType,
          category: txCat,
          date: new Date().toISOString().split('T')[0],
          author: userName
        };

        if (currentMode === 'pessoal') {
          setPersonalTx([newTx, ...personalTx]);
        } else {
          const updated = [newTx, ...familyTx];
          setFamilyTx(updated);
          syncFamilyWithCloud(familyCode, updated);
        }

        setDesc('');
        setVal('');
        setActiveTab('resumo');
        speakText(`${txType === 'income' ? 'Entrada' : 'Despesa'} de ${formatBRL(parsed)} adicionada.`);
      };

      const handleDelete = (id, description) => {
        if (currentMode === 'pessoal') {
          setPersonalTx(personalTx.filter(t => t.id !== id));
        } else {
          const updated = familyTx.filter(t => t.id !== id);
          setFamilyTx(updated);
          syncFamilyWithCloud(familyCode, updated);
        }
        speakText(`${description} excluído.`);
      };

      // Adicionar Investimento
      const handleAddInvestment = (e) => {
        e.preventDefault();
        const parsed = parseMaskedCurrency(invAmount);
        if (!invName.trim() || isNaN(parsed) || parsed <= 0) {
          alert('Preencha o nome e um valor válido.');
          return;
        }

        const newInv = {
          id: Date.now().toString(),
          name: invName.trim(),
          amount: parsed,
          type: invType,
          yieldRate: invYield || '100% CDI'
        };

        setInvestments([...investments, newInv]);
        setInvName('');
        setInvAmount('');
        speakText(`Investimento de ${formatBRL(parsed)} registrado.`);
      };

      // Lançamento por Voz
      const handleVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Reconhecimento de voz não suportado neste navegador. Use o Google Chrome.');
          return;
        }

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
          setIsListening(true);
        };

        recognition.onresult = (event) => {
          const text = event.results[0][0].transcript.toLowerCase();
          setIsListening(false);

          const numericVal = parseSpokenAmount(text);

          let type = 'expense';
          if (text.includes('ganhei') || text.includes('recebi') || text.includes('salário') || text.includes('aposentadoria') || text.includes('depósito')) {
            type = 'income';
          }

          let cat = 'OutrasDespesas';
          if (text.includes('remédio') || text.includes('farmácia')) cat = 'Remedios';
          else if (text.includes('mercado') || text.includes('compras') || text.includes('feira')) cat = 'Mercado';
          else if (text.includes('luz') || text.includes('água') || text.includes('gás')) cat = 'ContasCasa';
          else if (text.includes('aluguel') || text.includes('condomínio') || text.includes('reforma') || text.includes('imóvel')) cat = 'Moradia';
          else if (text.includes('salário')) cat = 'Salario';
          else if (text.includes('aposentadoria') || text.includes('inss')) cat = 'Aposentadoria';

          setDesc(text.charAt(0).toUpperCase() + text.slice(1));
          if (!isNaN(numericVal) && numericVal > 0) {
            setVal(numericVal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
          }
          setTxType(type);
          setTxCat(cat);

          setActiveTab('novo');
          speakText(`Entendi: ${text}. Toque em Salvar para confirmar.`);
        };

        recognition.onerror = () => {
          setIsListening(false);
        };

        recognition.start();
      };

      // Leitura de Imagem e PDF
      const handleFileScan = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessingDoc(true);
        setDocStatus('Processando documento...');

        try {
          let fullText = '';
          if (file.type === 'application/pdf') {
            const fileReader = new FileReader();
            fileReader.onload = async function () {
              const typedarray = new Uint8Array(this.result);
              const pdf = await pdfjsLib.getDocument(typedarray).promise;
              for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(' ') + '\n';
              }
              processDocText(fullText, file.name);
            };
            fileReader.readAsArrayBuffer(file);
          } else {
            const result = await Tesseract.recognize(file, 'por');
            fullText = result.data.text;
            processDocText(fullText, file.name);
          }
        } catch (err) {
          setIsProcessingDoc(false);
          setDocStatus('');
          alert('Erro ao processar o arquivo.');
        }
      };

      const processDocText = (text, fileName) => {
        setIsProcessingDoc(false);
        setDocStatus('');

        const matches = text.match(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})/gi);
        let finalVal = 0;
        if (matches && matches.length > 0) {
          const cleanVals = matches
            .map(m => {
              let clean = m.replace('R$', '').trim();
              if (clean.includes('.') && clean.includes(',')) clean = clean.replace(/\./g, '').replace(',', '.');
              else if (clean.includes(',')) clean = clean.replace(',', '.');
              return parseFloat(clean);
            })
            .filter(n => !isNaN(n));
          if (cleanVals.length > 0) {
            finalVal = Math.max(...cleanVals);
          }
        }

        let cat = 'OutrasDespesas';
        let type = 'expense';
        const lower = text.toLowerCase();
        if (lower.includes('farmacia') || lower.includes('drogaria')) cat = 'Remedios';
        else if (lower.includes('mercado') || lower.includes('supermercado')) cat = 'Mercado';
        else if (lower.includes('luz') || lower.includes('energia')) cat = 'ContasCasa';

        setDesc(`Extrato: ${fileName.replace(/\.[^/.]+$/, "")}`);
        if (finalVal > 0) {
          setVal(finalVal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
        }
        setTxType(type);
        setTxCat(cat);

        speakText(`Documento lido com sucesso.`);
        setActiveTab('novo');
      };

      const zoomClasses = {
        normal: { container: 'text-sm sm:text-base', cardValue: 'text-2xl sm:text-3xl', button: 'py-2.5 px-3 text-sm' },
        large: { container: 'text-base sm:text-lg', cardValue: 'text-3xl sm:text-4xl', button: 'py-3.5 px-4 text-base font-bold' },
        extra: { container: 'text-lg sm:text-xl', cardValue: 'text-4xl sm:text-5xl', button: 'py-4 px-5 text-lg font-black' }
      }[zoomLevel];

      return (
        <div className={`min-h-screen bg-slate-100 text-slate-900 pb-28 ${zoomClasses.container} overflow-x-hidden w-full`}>
          
          {/* CABEÇALHO */}
          <header className="bg-white border-b-2 border-slate-200 sticky top-0 z-40 px-3 py-2.5 shadow-sm w-full">
            <div className="max-w-xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                <div className={`p-2 text-white rounded-xl shrink-0 ${currentMode === 'pessoal' ? 'bg-indigo-600' : 'bg-emerald-600'}`}>
                  {currentMode === 'pessoal' ? <Icons.User /> : <Icons.Users />}
                </div>
                <div className="min-w-0">
                  <h1 className="font-extrabold text-slate-900 text-base sm:text-lg leading-tight truncate">
                    {currentMode === 'pessoal' ? `Contas de ${userName}` : 'Contas da Família'}
                  </h1>
                  <span className="text-[11px] font-bold text-slate-500">
                    {currentMode === 'pessoal' ? 'Dinheiro Individual' : `Sincronizado: ${familyCode}`}
                  </span>
                </div>
