<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planejamento Financeiro Fácil & Família</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Firestore via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Configuração pública do Firebase para sincronização em nuvem
    // (Pode utilizar esta predefinição ou configurar o seu próprio projeto no console.firebase.google.com)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForLiveSyncDemoOnly987654",
      authDomain: "financas-facil-sync.firebaseapp.com",
      projectId: "financas-facil-sync",
      storageBucket: "financas-facil-sync.appspot.com",
      messagingSenderId: "1029384756",
      appId: "1:1029384756:web:abcdef123456"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase a correr em modo offline/local fallback.");
    }

    const Icons = {
      Wallet: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>,
      TrendingUp: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      TrendingDown: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" /></svg>,
      Users: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
      Volume2: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,
      PlusCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Trash2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
      Key: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
    };

    const CATEGORIES = {
      income: [
        { id: 'Aposentadoria', label: 'Aposentadoria / INSS', color: 'bg-emerald-100 text-emerald-800' },
        { id: 'Salario', label: 'Salário / Trabalho', color: 'bg-blue-100 text-blue-800' },
        { id: 'Pensao', label: 'Pensão / Benefício', color: 'bg-teal-100 text-teal-800' },
        { id: 'Aluguel', label: 'Renda de Aluguel', color: 'bg-indigo-100 text-indigo-800' },
        { id: 'Investimentos', label: 'Rendimentos', color: 'bg-amber-100 text-amber-800' },
        { id: 'OutrasReceitas', label: 'Outras Entradas', color: 'bg-slate-100 text-slate-800' }
      ],
      expense: [
        { id: 'Remedios', label: 'Remédios & Farmácia', color: 'bg-rose-100 text-rose-800' },
        { id: 'Mercado', label: 'Supermercado & Feira', color: 'bg-amber-100 text-amber-800' },
        { id: 'ContasCasa', label: 'Água, Luz e Gás', color: 'bg-orange-100 text-orange-800' },
        { id: 'Moradia', label: 'Aluguel / Condomínio', color: 'bg-indigo-100 text-indigo-800' },
        { id: 'Telefone', label: 'Celular & Internet', color: 'bg-sky-100 text-sky-800' },
        { id: 'Saude', label: 'Plano de Saúde & Exames', color: 'bg-red-100 text-red-800' },
        { id: 'Transporte', label: 'Transporte & Carro', color: 'bg-cyan-100 text-cyan-800' },
        { id: 'OutrasDespesas', label: 'Outros Gastos', color: 'bg-slate-100 text-slate-800' }
      ]
    };

    function App() {
      // Perfil da Pessoa e Código da Família
      const [userName, setUserName] = useState(() => localStorage.getItem('usuario_nome') || 'Titular');
      const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('familia_codigo') || '');
      const [inputCode, setInputCode] = useState('');

      // Transações
      const [transactions, setTransactions] = useState(() => {
        try {
          const saved = localStorage.getItem('planejamento_facil_db');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      // Filtro de Visão: 'tudo' (família) ou 'meu' (apenas os meus)
      const [viewFilter, setViewFilter] = useState('tudo');
      const [zoomLevel, setZoomLevel] = useState('large');
      const [activeTab, setActiveTab] = useState('resumo');

      // Formulário
      const [desc, setDesc] = useState('');
      const [val, setVal] = useState('');
      const [txType, setTxType] = useState('expense');
      const [txCat, setTxCat] = useState('Remedios');
      const [isFamilyScope, setIsFamilyScope] = useState(true); // Se partilha com a família

      // Gravação local persistente
      useEffect(() => {
        localStorage.setItem('planejamento_facil_db', JSON.stringify(transactions));
        localStorage.setItem('usuario_nome', userName);
        localStorage.setItem('familia_codigo', familyCode);
      }, [transactions, userName, familyCode]);

      // Sincronização em tempo real via Nuvem (Firestore)
      useEffect(() => {
        if (!familyCode || !db) return;

        const unsubscribe = db.collection('familias')
          .doc(familyCode.toUpperCase().trim())
          .collection('transacoes')
          .onSnapshot((snapshot) => {
            const cloudData = [];
            snapshot.forEach(doc => cloudData.push({ id: doc.id, ...doc.data() }));
            if (cloudData.length > 0) {
              setTransactions(cloudData);
            }
          }, (err) => {
            console.log("A sincronizar localmente.");
          });

        return () => unsubscribe && unsubscribe();
      }, [familyCode]);

      const speakText = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'pt-BR';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      };

      // Gerador de código curto para a família (Ex: FAM-7491)
      const generateNewFamilyCode = () => {
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const code = `FAM-${randomNum}`;
        setFamilyCode(code);
        speakText(`Novo código de família criado: ${code}`);
        alert(`O seu código de família é: ${code}\nGuarde ou passe para o outro telemóvel!`);
      };

      const handleConnectFamily = (e) => {
        e.preventDefault();
        if (!inputCode.trim()) return;
        const code = inputCode.trim().toUpperCase();
        setFamilyCode(code);
        setInputCode('');
        speakText(`Conectado à família ${code}`);
        alert(`Conectado à família: ${code}! Os dados partilhados vão sincronizar.`);
      };

      // Filtra transações conforme a visão selecionada
      const filteredTransactions = useMemo(() => {
        if (viewFilter === 'meu') {
          return transactions.filter(t => t.author === userName);
        }
        return transactions.filter(t => t.isFamily || t.author === userName);
      }, [transactions, viewFilter, userName]);

      const { totalIncome, totalExpense, balance } = useMemo(() => {
        let inc = 0, exp = 0;
        filteredTransactions.forEach(t => {
          if (t.type === 'income') inc += t.amount;
          else exp += t.amount;
        });
        return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
      }, [filteredTransactions]);

      const formatBRL = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

      const handleAdd = async (e) => {
        e.preventDefault();
        const parsed = parseFloat(val.replace(',', '.'));
        if (!desc || isNaN(parsed) || parsed <= 0) {
          speakText('Preencha a descrição e um valor válido.');
          return;
        }

        const newTx = {
          id: Date.now().toString(),
          description: desc,
          amount: parsed,
          type: txType,
          category: txCat,
          date: new Date().toISOString().split('T')[0],
          author: userName,
          isFamily: isFamilyScope
        };

        // Grava no estado local
        setTransactions(prev => [newTx, ...prev]);

        // Grava na Nuvem se estiver ligado a uma Família
        if (familyCode && db && isFamilyScope) {
          try {
            await db.collection('familias')
              .doc(familyCode.toUpperCase().trim())
              .collection('transacoes')
              .doc(newTx.id)
              .set(newTx);
          } catch (e) {
            console.error("Erro ao sincronizar na nuvem:", e);
          }
        }

        setDesc('');
        setVal('');
        setActiveTab('resumo');
        speakText(`${txType === 'income' ? 'Entrada' : 'Despesa'} guardada.`);
      };

      const handleDelete = async (id, description) => {
        setTransactions(prev => prev.filter(t => t.id !== id));
        if (familyCode && db) {
          try {
            await db.collection('familias')
              .doc(familyCode.toUpperCase().trim())
              .collection('transacoes')
              .doc(id)
              .delete();
          } catch(e) {}
        }
        speakText(`${description} apagado.`);
      };

      const zoomClasses = {
        normal: { container: 'text-base', cardValue: 'text-2xl', button: 'py-2.5 px-4 text-base' },
        large: { container: 'text-lg', cardValue: 'text-3xl', button: 'py-3.5 px-5 text-lg font-bold' },
        extra: { container: 'text-xl', cardValue: 'text-4xl', button: 'py-4.5 px-6 text-xl font-black' }
      }[zoomLevel];

      return (
        <div className={`min-h-screen bg-slate-100 text-slate-900 pb-28 ${zoomClasses.container}`}>
          {/* Barra Superior */}
          <header className="bg-white border-b-2 border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
            <div className="max-w-3xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="p-2 bg-emerald-600 text-white rounded-xl">
                  <Icons.Wallet />
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 leading-tight">Finanças Família</h1>
                  <div className="flex items-center gap-1 text-xs font-bold text-slate-500">
                    <span className="text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">Perfil: {userName}</span>
                    {familyCode && (
                      <span className="text-blue-700 bg-blue-100 px-2 py-0.5 rounded-md">Cód: {familyCode}</span>
                    )}
                  </div>
                </div>
              </div>

              {/* Ajuste de Letras */}
              <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-300">
                <button onClick={() => setZoomLevel('normal')} className={`px-2 py-1 rounded-xl text-sm font-bold ${zoomLevel === 'normal' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}>A</button>
                <button onClick={() => setZoomLevel('large')} className={`px-2 py-1 rounded-xl text-base font-bold ${zoomLevel === 'large' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}>A+</button>
                <button onClick={() => setZoomLevel('extra')} className={`px-2 py-1 rounded-xl text-lg font-black ${zoomLevel === 'extra' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}>A++</button>
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4 space-y-4">
            
            {/* Seletor de Visão: Todas as Contas da Família OU Apenas as Minhas */}
            <div className="flex bg-white p-1.5 rounded-2xl border-2 border-slate-300 shadow-sm gap-1">
              <button
                onClick={() => { setViewFilter('tudo'); speakText('Visão geral da família'); }}
                className={`flex-1 py-2.5 rounded-xl font-black text-sm flex items-center justify-center gap-2 ${viewFilter === 'tudo' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
              >
                <Icons.Users /> Contas da Família
              </button>
              <button
                onClick={() => { setViewFilter('meu'); speakText('Minhas contas pessoais'); }}
                className={`flex-1 py-2.5 rounded-xl font-black text-sm flex items-center justify-center gap-2 ${viewFilter === 'meu' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
              >
                <Icons.User /> Apenas Minhas ({userName})
              </button>
            </div>

            {/* ABA: RESUMO */}
            {activeTab === 'resumo' && (
              <div className="space-y-4">
                <div className={`p-6 rounded-3xl border-2 shadow-sm ${balance >= 0 ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                  <div className="flex justify-between items-center text-slate-600 font-bold">
                    <span>Saldo Disponível ({viewFilter === 'tudo' ? 'Família' : userName}):</span>
                  </div>
                  <div className={`mt-2 font-black ${zoomClasses.cardValue} ${balance >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>
                    {formatBRL(balance)}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-4 rounded-2xl border-2 border-emerald-200">
                    <span className="text-xs font-bold text-slate-500 block">Total Entradas</span>
                    <span className="font-extrabold text-emerald-600 text-xl">{formatBRL(totalIncome)}</span>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border-2 border-rose-200">
                    <span className="text-xs font-bold text-slate-500 block">Total Saídas</span>
                    <span className="font-extrabold text-rose-600 text-xl">{formatBRL(totalExpense)}</span>
                  </div>
                </div>

                <button onClick={() => setActiveTab('novo')} className={`w-full bg-slate-900 text-white rounded-2xl flex items-center justify-center gap-3 shadow-md ${zoomClasses.button}`}>
                  <Icons.PlusCircle />
                  <span>Anotar Nova Conta / Dinheiro</span>
                </button>
              </div>
            )}

            {/* ABA: NOVO LANÇAMENTO */}
            {activeTab === 'novo' && (
              <div className="bg-white p-6 rounded-3xl border-2 border-slate-300 shadow-sm space-y-4">
                <h2 className="font-black text-slate-900 text-2xl">Anotar Movimento</h2>

                <div className="grid grid-cols-2 gap-3">
                  <button type="button" onClick={() => setTxType('income')} className={`py-3 rounded-2xl font-black border-2 ${txType === 'income' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-slate-100'}`}>
                    + Entrada
                  </button>
                  <button type="button" onClick={() => setTxType('expense')} className={`py-3 rounded-2xl font-black border-2 ${txType === 'expense' ? 'bg-rose-600 text-white border-rose-700' : 'bg-slate-100'}`}>
                    - Saída (Gasto)
                  </button>
                </div>

                <form onSubmit={handleAdd} className="space-y-4">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">O que é?</label>
                    <input type="text" placeholder="Ex: Farmácia, Mercado, Salário..." value={desc} onChange={(e) => setDesc(e.target.value)} className="w-full p-3.5 border-2 border-slate-300 rounded-2xl text-lg font-medium outline-none focus:border-emerald-600" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" placeholder="0,00" value={val} onChange={(e) => setVal(e.target.value)} className="w-full p-3.5 border-2 border-slate-300 rounded-2xl text-2xl font-black text-slate-900 outline-none focus:border-emerald-600" />
                  </div>

                  {/* Interruptor: Compartilhar com Família */}
                  <div className="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl flex items-center justify-between">
                    <div>
                      <span className="font-extrabold text-slate-900 block">Sincronizar com a Família?</span>
                      <span className="text-xs text-slate-500 font-bold">
                        {isFamilyScope ? 'Todos da família vão ver esta conta' : 'Apenas você verá este lançamento'}
                      </span>
                    </div>
                    <input
                      type="checkbox"
                      checked={isFamilyScope}
                      onChange={(e) => setIsFamilyScope(e.target.checked)}
                      className="w-7 h-7 accent-emerald-600 rounded-lg cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-2">Categoria:</label>
                    <div className="grid grid-cols-2 gap-2">
                      {CATEGORIES[txType].map((cat) => (
                        <button key={cat.id} type="button" onClick={() => setTxCat(cat.id)} className={`p-2.5 rounded-xl border-2 text-left text-xs font-bold ${txCat === cat.id ? 'border-emerald-600 bg-emerald-50 text-emerald-950' : 'border-slate-200 bg-slate-50 text-slate-600'}`}>
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button type="submit" className={`flex-1 bg-emerald-600 text-white rounded-2xl shadow-md ${zoomClasses.button}`}>Salvar</button>
                    <button type="button" onClick={() => setActiveTab('resumo')} className="px-5 py-3 bg-slate-200 rounded-2xl font-bold">Voltar</button>
                  </div>
                </form>
              </div>
            )}

            {/* ABA: HISTÓRICO */}
            {activeTab === 'historico' && (
              <div className="bg-white p-5 rounded-3xl border-2 border-slate-300 shadow-sm space-y-4">
                <h2 className="font-black text-slate-900 text-2xl">Lançamentos</h2>
                <div className="divide-y-2 divide-slate-100">
                  {filteredTransactions.map((tx) => (
                    <div key={tx.id} className="py-3 flex items-center justify-between">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <p className="font-extrabold text-slate-900 text-base">{tx.description}</p>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${tx.isFamily ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}`}>
                            {tx.isFamily ? 'Família' : 'Pessoal'}
                          </span>
                        </div>
                        <span className="text-xs font-bold text-slate-500">
                          {tx.date} • Por: {tx.author || 'Eu'}
                        </span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className={`font-black text-lg ${tx.type === 'income' ? 'text-emerald-700' : 'text-rose-700'}`}>
                          {tx.type === 'income' ? '+' : '-'} {formatBRL(tx.amount)}
                        </span>
                        <button onClick={() => handleDelete(tx.id, tx.description)} className="p-2 text-slate-400 hover:text-rose-600">
                          <Icons.Trash2 />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ABA: FAMÍLIA & PERFIL */}
            {activeTab === 'familia' && (
              <div className="bg-white p-6 rounded-3xl border-2 border-slate-300 shadow-sm space-y-6">
                <div>
                  <h2 className="font-black text-slate-900 text-2xl">Perfis & Código da Família</h2>
                  <p className="text-slate-600 text-sm mt-1">
                    Crie um código curto (ex: FAM-1234) e use no outro telemóvel para partilharem a mesma conta.
                  </p>
                </div>

                {/* Perfil Pessoal */}
                <div className="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl space-y-3">
                  <h3 className="font-bold text-slate-900 text-lg flex items-center gap-2">
                    <Icons.User /> Meu Nome no Telemóvel:
                  </h3>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={userName}
                      onChange={(e) => setUserName(e.target.value)}
                      placeholder="Ex: Mãe, Pai, João, Maria..."
                      className="flex-1 p-3 border-2 border-slate-300 rounded-xl font-bold"
                    />
                    <button
                      onClick={() => { alert('Nome guardado com sucesso!'); speakText(`Nome atualizado para ${userName}`); }}
                      className="px-4 bg-slate-900 text-white font-bold rounded-xl"
                    >
                      Guardar
                    </button>
                  </div>
                </div>

                {/* Gerar Código de Família */}
                <div className="p-4 bg-emerald-50 border-2 border-emerald-300 rounded-2xl space-y-3">
                  <h3 className="font-bold text-emerald-950 text-lg flex items-center gap-2">
                    <Icons.Key /> 1. Criar Código de Família Curto
                  </h3>
                  <p className="text-xs text-slate-700">
                    Clique abaixo para gerar um código reduzido para conectar todos os telemóveis:
                  </p>
                  {familyCode ? (
                    <div className="p-3 bg-white border-2 border-emerald-400 rounded-xl flex items-center justify-between">
                      <span className="text-xl font-black text-emerald-800 tracking-wider">{familyCode}</span>
                      <button onClick={generateNewFamilyCode} className="text-xs text-emerald-700 font-bold underline">Gerar Outro</button>
                    </div>
                  ) : (
                    <button onClick={generateNewFamilyCode} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-sm">
                      Gerar Novo Código de Família
                    </button>
                  )}
                </div>

                {/* Entrar numa Família com Código */}
                <div className="p-4 bg-blue-50 border-2 border-blue-300 rounded-2xl space-y-3">
                  <h3 className="font-bold text-blue-950 text-lg flex items-center gap-2">
                    <Icons.Users /> 2. Conectar com Código de Outro Aparelho
                  </h3>
                  <p className="text-xs text-slate-700">
                    Se outro telemóvel já tem o código, digite-o aqui para se juntarem:
                  </p>
                  <form onSubmit={handleConnectFamily} className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Ex: FAM-1234"
                      value={inputCode}
                      onChange={(e) => setInputCode(e.target.value)}
                      className="flex-1 p-3 border-2 border-blue-300 rounded-xl font-mono font-bold uppercase"
                    />
                    <button type="submit" className="px-5 bg-blue-700 text-white font-bold rounded-xl shadow-sm">
                      Entrar
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* Barra de Navegação Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-300 p-2 z-40 shadow-lg">
            <div className="max-w-3xl mx-auto grid grid-cols-4 gap-1">
              <button onClick={() => setActiveTab('resumo')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'resumo' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.Wallet />
                <span className="text-xs mt-1">Resumo</span>
              </button>
              <button onClick={() => setActiveTab('novo')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'novo' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.PlusCircle />
                <span className="text-xs mt-1">+ Anotar</span>
              </button>
              <button onClick={() => setActiveTab('historico')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'historico' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.Calendar />
                <span className="text-xs mt-1">Contas</span>
              </button>
              <button onClick={() => setActiveTab('familia')} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'familia' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.Users />
                <span className="text-xs mt-1">Família</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
