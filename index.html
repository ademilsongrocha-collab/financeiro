<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planejamento Financeiro Fácil</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icons = {
      Wallet: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>,
      TrendingUp: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
      TrendingDown: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" /></svg>,
      Volume2: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,
      VolumeX: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>,
      PlusCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Trash2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Share2: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
    };

    const CATEGORIES = {
      income: [
        { id: 'Aposentadoria', label: 'Aposentadoria / INSS', color: 'bg-emerald-100 text-emerald-800' },
        { id: 'Salario', label: 'Salário / Emprego', color: 'bg-blue-100 text-blue-800' },
        { id: 'Pensao', label: 'Pensão / Benefício', color: 'bg-teal-100 text-teal-800' },
        { id: 'AluguelRecebido', label: 'Aluguel Recebido', color: 'bg-indigo-100 text-indigo-800' },
        { id: 'Investimentos', label: 'Rendimentos / Poupança', color: 'bg-amber-100 text-amber-800' },
        { id: 'BicoExtra', label: 'Trabalho Extra / Bico', color: 'bg-purple-100 text-purple-800' },
        { id: 'OutrasReceitas', label: 'Outras Entradas', color: 'bg-slate-100 text-slate-800' }
      ],
      expense: [
        { id: 'Remedios', label: 'Remédios & Farmácia', color: 'bg-rose-100 text-rose-800' },
        { id: 'Mercado', label: 'Supermercado & Feira', color: 'bg-amber-100 text-amber-800' },
        { id: 'ContasCasa', label: 'Água, Luz e Gás', color: 'bg-orange-100 text-orange-800' },
        { id: 'Moradia', label: 'Aluguel / Condomínio / IPTU', color: 'bg-indigo-100 text-indigo-800' },
        { id: 'Telefonia', label: 'Celular & Internet', color: 'bg-sky-100 text-sky-800' },
        { id: 'Saude', label: 'Médico & Plano de Saúde', color: 'bg-red-100 text-red-800' },
        { id: 'Transporte', label: 'Transporte & Combustível', color: 'bg-cyan-100 text-cyan-800' },
        { id: 'Educacao', label: 'Educação & Cursos', color: 'bg-purple-100 text-purple-800' },
        { id: 'Lazer', label: 'Passeios & Lazer', color: 'bg-pink-100 text-pink-800' },
        { id: 'OutrasDespesas', label: 'Outros Gastos', color: 'bg-slate-100 text-slate-800' }
      ]
    };

    const INITIAL_TRANSACTIONS = [
      { id: '1', description: 'Aposentadoria / Benefício', amount: 3200, type: 'income', category: 'Aposentadoria', date: '2026-10-05' },
      { id: '2', description: 'Farmácia e Remédios', amount: 340, type: 'expense', category: 'Remedios', date: '2026-10-06' },
      { id: '3', description: 'Compras de Mercado', amount: 620, type: 'expense', category: 'Mercado', date: '2026-10-08' },
      { id: '4', description: 'Conta de Energia', amount: 185, type: 'expense', category: 'ContasCasa', date: '2026-10-10' },
      { id: '5', description: 'Telefone e Internet', amount: 110, type: 'expense', category: 'Telefonia', date: '2026-10-12' },
      { id: '6', description: 'Plano de Saúde', amount: 480, type: 'expense', category: 'Saude', date: '2026-10-14' }
    ];

    function App() {
      const [transactions, setTransactions] = useState(() => {
        try {
          const saved = localStorage.getItem('planejamento_facil_db');
          return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
        } catch {
          return INITIAL_TRANSACTIONS;
        }
      });

      const [zoomLevel, setZoomLevel] = useState('large');
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [activeTab, setActiveTab] = useState('resumo');
      const [shareInputCode, setShareInputCode] = useState('');

      const [desc, setDesc] = useState('');
      const [val, setVal] = useState('');
      const [txType, setTxType] = useState('expense');
      const [txCat, setTxCat] = useState('Remedios');

      useEffect(() => {
        localStorage.setItem('planejamento_facil_db', JSON.stringify(transactions));
      }, [transactions]);

      const speakText = (text) => {
        if (!audioEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      };

      const { totalIncome, totalExpense, balance } = useMemo(() => {
        let inc = 0, exp = 0;
        transactions.forEach(t => {
          if (t.type === 'income') inc += t.amount;
          else exp += t.amount;
        });
        return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
      }, [transactions]);

      const formatBRL = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

      const handleAdd = (e) => {
        e.preventDefault();
        const parsed = parseFloat(val.replace(',', '.'));
        if (!desc || isNaN(parsed) || parsed <= 0) {
          speakText('Por favor, indique a descrição e um valor válido.');
          return;
        }

        const newTx = {
          id: Date.now().toString(),
          description: desc,
          amount: parsed,
          type: txType,
          category: txCat,
          date: new Date().toISOString().split('T')[0]
        };

        setTransactions([newTx, ...transactions]);
        setDesc('');
        setVal('');
        setActiveTab('resumo');
        speakText(`${txType === 'income' ? 'Entrada' : 'Despesa'} de ${formatBRL(parsed)} guardada.`);
      };

      const handleDelete = (id, description, amount) => {
        setTransactions(transactions.filter(t => t.id !== id));
        speakText(`${description} removido.`);
      };

      const handleHearSummary = () => {
        speakText(`Resumo das suas contas. Saldo atual: ${formatBRL(balance)}. Entradas: ${formatBRL(totalIncome)}. Saídas: ${formatBRL(totalExpense)}.`);
      };

      const exportCode = useMemo(() => btoa(unescape(encodeURIComponent(JSON.stringify(transactions)))), [transactions]);

      const handleImportCode = () => {
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(shareInputCode.trim()))));
          if (Array.isArray(decoded)) {
            setTransactions(decoded);
            setShareInputCode('');
            speakText('Dados sincronizados com sucesso!');
            alert('Contas importadas com sucesso!');
            setActiveTab('resumo');
          } else {
            alert('Código inválido.');
          }
        } catch {
          alert('Erro ao carregar o código.');
        }
      };

      const zoomClasses = {
        normal: { container: 'text-base', cardValue: 'text-2xl', button: 'py-2.5 px-4 text-base' },
        large: { container: 'text-lg', cardValue: 'text-3xl', button: 'py-3.5 px-5 text-lg font-bold' },
        extra: { container: 'text-xl', cardValue: 'text-4xl', button: 'py-4.5 px-6 text-xl font-black' }
      }[zoomLevel];

      return (
        <div className={`min-h-screen bg-slate-100 text-slate-900 pb-28 ${zoomClasses.container}`}>
          <header className="bg-white border-b-2 border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
            <div className="max-w-3xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="p-2 bg-emerald-600 text-white rounded-xl">
                  <Icons.Wallet />
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 leading-tight">Finanças Fácil</h1>
                  <span className="text-xs text-slate-500 font-bold">Gestão Simples</span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-2xl border border-slate-300">
                <button onClick={() => setZoomLevel('normal')} className={`px-2.5 py-1 rounded-xl text-sm font-bold ${zoomLevel === 'normal' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}>A</button>
                <button onClick={() => setZoomLevel('large')} className={`px-2.5 py-1 rounded-xl text-base font-bold ${zoomLevel === 'large' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}>A+</button>
                <button onClick={() => setZoomLevel('extra')} className={`px-2.5 py-1 rounded-xl text-lg font-black ${zoomLevel === 'extra' ? 'bg-emerald-600 text-white' : 'text-slate-700'}`}>A++</button>
                <button onClick={() => { setAudioEnabled(!audioEnabled); if(!audioEnabled) speakText('Voz ativada'); }} className={`p-1.5 rounded-xl ml-1 ${audioEnabled ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-500'}`}>
                  {audioEnabled ? <Icons.Volume2 /> : <Icons.VolumeX />}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4 space-y-5">
            <button onClick={handleHearSummary} className="w-full bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-md flex items-center justify-center gap-3 font-bold hover:opacity-95">
              <Icons.Volume2 />
              <span>Ouvir Resumo das Contas em Voz Alta</span>
            </button>

            {activeTab === 'resumo' && (
              <div className="space-y-4">
                <div className={`p-6 rounded-3xl border-2 shadow-sm ${balance >= 0 ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                  <div className="flex justify-between items-center text-slate-600 font-bold">
                    <span>Saldo que sobrou:</span>
                    <span className="text-xs uppercase bg-white/80 px-3 py-1 rounded-full border border-slate-200">Atual</span>
                  </div>
                  <div className={`mt-2 font-black tracking-tight ${zoomClasses.cardValue} ${balance >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>
                    {formatBRL(balance)}
                  </div>
                  <p className="text-sm mt-1 text-slate-600 font-semibold">
                    {balance >= 0 ? 'As suas contas estão positivas!' : 'Atenção: Os gastos superaram os rendimentos.'}
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-white p-5 rounded-2xl border-2 border-emerald-200 shadow-sm flex items-center gap-4">
                    <div className="p-3 bg-emerald-100 text-emerald-700 rounded-2xl"><Icons.TrendingUp /></div>
                    <div>
                      <span className="text-slate-500 font-bold block text-sm">Total que Entrou</span>
                      <span className="font-extrabold text-emerald-600 text-2xl">{formatBRL(totalIncome)}</span>
                    </div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border-2 border-rose-200 shadow-sm flex items-center gap-4">
                    <div className="p-3 bg-rose-100 text-rose-700 rounded-2xl"><Icons.TrendingDown /></div>
                    <div>
                      <span className="text-slate-500 font-bold block text-sm">Total que Saiu (Gastos)</span>
                      <span className="font-extrabold text-rose-600 text-2xl">{formatBRL(totalExpense)}</span>
                    </div>
                  </div>
                </div>

                <button onClick={() => setActiveTab('novo')} className={`w-full bg-slate-900 text-white rounded-2xl flex items-center justify-center gap-3 shadow-md hover:bg-slate-800 ${zoomClasses.button}`}>
                  <Icons.PlusCircle />
                  <span>Anotar Nova Despesa ou Receita</span>
                </button>
              </div>
            )}

            {activeTab === 'novo' && (
              <div className="bg-white p-6 rounded-3xl border-2 border-slate-300 shadow-sm space-y-5">
                <h2 className="font-black text-slate-900 text-2xl">Anotar Movimento</h2>

                <div className="grid grid-cols-2 gap-3">
                  <button type="button" onClick={() => { setTxType('income'); setTxCat('Aposentadoria'); speakText('Entrada selecionada'); }} className={`py-3.5 rounded-2xl font-black border-2 flex items-center justify-center gap-2 ${txType === 'income' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-slate-100 text-slate-700 border-slate-300'}`}>
                    <Icons.TrendingUp /> Entrada
                  </button>
                  <button type="button" onClick={() => { setTxType('expense'); setTxCat('Remedios'); speakText('Saída selecionada'); }} className={`py-3.5 rounded-2xl font-black border-2 flex items-center justify-center gap-2 ${txType === 'expense' ? 'bg-rose-600 text-white border-rose-700' : 'bg-slate-100 text-slate-700 border-slate-300'}`}>
                    <Icons.TrendingDown /> Saída (Gasto)
                  </button>
                </div>

                <form onSubmit={handleAdd} className="space-y-4">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Descrição</label>
                    <input type="text" placeholder="Ex: Remédios, Mercado, Salário..." value={desc} onChange={(e) => setDesc(e.target.value)} className="w-full p-4 border-2 border-slate-300 rounded-2xl text-lg font-medium focus:border-emerald-600 outline-none" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" placeholder="0,00" value={val} onChange={(e) => setVal(e.target.value)} className="w-full p-4 border-2 border-slate-300 rounded-2xl text-2xl font-black text-slate-900 focus:border-emerald-600 outline-none" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-2">Categoria:</label>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                      {CATEGORIES[txType].map((cat) => (
                        <button key={cat.id} type="button" onClick={() => { setTxCat(cat.id); speakText(cat.label); }} className={`p-3 rounded-2xl border-2 text-left flex items-center gap-2 transition-all ${txCat === cat.id ? 'border-emerald-600 bg-emerald-50 text-emerald-950 font-bold' : 'border-slate-200 bg-slate-50 text-slate-700'}`}>
                          <span className={`text-xs px-2 py-1 rounded-lg ${cat.color}`}>{cat.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="pt-2 flex gap-3">
                    <button type="submit" className={`flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-md ${zoomClasses.button}`}>Salvar</button>
                    <button type="button" onClick={() => setActiveTab('resumo')} className="px-6 py-3 bg-slate-200 text-slate-700 rounded-2xl font-bold">Voltar</button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'historico' && (
              <div className="bg-white p-5 rounded-3xl border-2 border-slate-300 shadow-sm space-y-4">
                <h2 className="font-black text-slate-900 text-2xl">Todas as Contas</h2>
                <div className="divide-y-2 divide-slate-100">
                  {transactions.map((tx) => (
                    <div key={tx.id} className="py-4 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <button onClick={() => speakText(`${tx.description}, ${formatBRL(tx.amount)}`)} className="p-3 bg-slate-100 hover:bg-amber-100 text-slate-700 rounded-2xl" title="Ouvir">
                          <Icons.Volume2 />
                        </button>
                        <div>
                          <p className="font-extrabold text-slate-900">{tx.description}</p>
                          <span className="text-xs font-bold text-slate-500">{tx.date} | {tx.category}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className={`font-black text-xl ${tx.type === 'income' ? 'text-emerald-700' : 'text-rose-700'}`}>
                          {tx.type === 'income' ? '+' : '-'} {formatBRL(tx.amount)}
                        </span>
                        <button onClick={() => handleDelete(tx.id, tx.description, tx.amount)} className="p-2 text-slate-400 hover:text-rose-600">
                          <Icons.Trash2 />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'compartilhar' && (
              <div className="bg-white p-6 rounded-3xl border-2 border-slate-300 shadow-sm space-y-6">
                <h2 className="font-black text-slate-900 text-2xl">Sincronizar com outro Aparelho</h2>
                
                <div className="p-4 bg-emerald-50 border-2 border-emerald-300 rounded-2xl space-y-3">
                  <h3 className="font-bold text-emerald-900 text-lg">Enviar pelo WhatsApp</h3>
                  <button onClick={() => {
                    const msg = `Resumo Financeiro Fácil:%0ASaldo: ${formatBRL(balance)}%0ACódigo:%0A${exportCode}`;
                    window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
                  }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 px-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <Icons.Share2 /> Enviar via WhatsApp
                  </button>
                </div>

                <div className="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl space-y-3">
                  <h3 className="font-bold text-slate-800 text-lg">Copiar Código</h3>
                  <button onClick={() => { navigator.clipboard.writeText(exportCode); alert('Código copiado!'); }} className="w-full bg-slate-900 text-white py-3 px-4 rounded-xl font-bold">
                    Copiar Código de Segurança
                  </button>
                </div>

                <div className="p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl space-y-3">
                  <h3 className="font-bold text-amber-950 text-lg">Receber Dados de Outro Aparelho</h3>
                  <textarea rows={3} placeholder="Cole o código aqui..." value={shareInputCode} onChange={(e) => setShareInputCode(e.target.value)} className="w-full p-3 border-2 border-amber-300 rounded-xl font-mono text-xs outline-none" />
                  <button onClick={handleImportCode} className="w-full bg-amber-700 hover:bg-amber-800 text-white py-3 px-4 rounded-xl font-bold">
                    Carregar Contas
                  </button>
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-300 p-2 z-40 shadow-lg">
            <div className="max-w-3xl mx-auto grid grid-cols-4 gap-1">
              <button onClick={() => { setActiveTab('resumo'); speakText('Resumo'); }} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'resumo' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.Wallet />
                <span className="text-xs mt-1">Resumo</span>
              </button>
              <button onClick={() => { setActiveTab('novo'); speakText('Anotar'); }} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'novo' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.PlusCircle />
                <span className="text-xs mt-1">+ Anotar</span>
              </button>
              <button onClick={() => { setActiveTab('historico'); speakText('Lista'); }} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'historico' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.Calendar />
                <span className="text-xs mt-1">Lista</span>
              </button>
              <button onClick={() => { setActiveTab('compartilhar'); speakText('Partilhar'); }} className={`flex flex-col items-center py-2 rounded-2xl ${activeTab === 'compartilhar' ? 'bg-emerald-100 text-emerald-900 font-extrabold' : 'text-slate-600'}`}>
                <Icons.Share2 />
                <span className="text-xs mt-1">Salvar</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
